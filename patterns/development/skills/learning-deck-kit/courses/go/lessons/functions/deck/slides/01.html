<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>関数は入力を受け取り結果を返す</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; script-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'"
    />
    <link rel="stylesheet" href="../theme.css" />
  </head>
  <body>
    <article class="slide">
      <header class="slide-header">
        <div class="eyebrow">GO / 関数</div>
        <div class="folio">01 / 02</div>
      </header>
      <main class="content">
        <h2>関数は入力を受け取り結果を返す</h2>
        <p class="lead">remaining(3, 1)は、3と1を受け取って、残りの2を返す。</p>
        <figure class="diagram">
          <svg viewBox="0 0 1440 360" role="img" aria-label="入力の3と1が関数へ渡り、結果の2が戻る">
            <title>入力の3と1が関数へ渡り、結果の2が戻る</title>
            <g data-learning-target="arguments">
              <rect class="node" x="60" y="80" width="360" height="200" rx="16" />
              <text class="diagram-text" x="240" y="140" text-anchor="middle">入力</text>
              <text class="diagram-result" x="240" y="220" text-anchor="middle">3, 1</text>
            </g>
            <path class="link" d="M 440 180 H 524" />
            <path class="arrow-head" d="M 520 172 L 536 180 L 520 188 Z" />
            <rect class="emphasis-node" x="556" y="80" width="360" height="200" rx="16" />
            <text class="diagram-text" x="736" y="140" text-anchor="middle">処理</text>
            <text class="diagram-code" x="736" y="194" text-anchor="middle">remaining</text>
            <text class="diagram-code" x="736" y="242" text-anchor="middle">3 - 1</text>
            <path class="link" d="M 936 180 H 1020" />
            <path class="arrow-head" d="M 1016 172 L 1032 180 L 1016 188 Z" />
            <g data-learning-target="return-value">
              <rect class="node" x="1052" y="80" width="328" height="200" rx="16" />
              <text class="diagram-text" x="1216" y="140" text-anchor="middle">戻り値</text>
              <text class="diagram-result" x="1216" y="230" text-anchor="middle">2</text>
            </g>
          </svg>
        </figure>
        <p class="summary">呼び出し元は、返ってきた値を表示や別の計算に使える。</p>
      </main>
      <footer class="slide-footer">
        <div class="source">Go言語仕様：Function declarations / Function calls</div>
        <div>Go 1.27 / 2026-10-24</div>
      </footer>
    </article>
  </body>
</html>
