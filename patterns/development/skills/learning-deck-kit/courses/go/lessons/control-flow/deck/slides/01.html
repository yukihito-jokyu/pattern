<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>forは本体の前に継続条件を確認する</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; script-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'"
    />
    <link rel="stylesheet" href="../theme.css" />
  </head>
  <body>
    <article class="slide">
      <header class="slide-header">
        <div class="eyebrow">GO / 制御構文</div>
        <div class="folio">01 / 02</div>
      </header>
      <main class="content">
        <h2>forは本体の前に継続条件を確認する</h2>
        <p class="lead">初期化 → 条件確認 → 本体 → 更新を、条件がfalseになるまで繰り返す。</p>
        <figure class="diagram">
          <svg
            viewBox="0 0 1440 360"
            role="img"
            aria-label="lessonが1から3なら本体を実行し、4では終了する"
          >
            <title>lessonが1から3なら本体を実行し、4では終了する</title>
            <g data-learning-target="loop-condition">
              <rect class="emphasis-node" x="60" y="32" width="1320" height="64" rx="16" />
              <text class="diagram-code" x="720" y="76" text-anchor="middle">
                継続条件：lesson &lt;= 3
              </text>
            </g>
            <text class="diagram-label" x="250" y="146" text-anchor="middle">lesson</text>
            <text class="diagram-label" x="660" y="146" text-anchor="middle">条件の結果</text>
            <text class="diagram-label" x="1120" y="146" text-anchor="middle">本体での表示</text>
            <text class="diagram-code" x="250" y="194" text-anchor="middle">1 → 2 → 3</text>
            <text class="diagram-code" x="660" y="194" text-anchor="middle">true</text>
            <text class="diagram-code" x="1120" y="194" text-anchor="middle">learn / review</text>
            <path class="link" d="M 180 224 H 1260" />
            <g data-learning-target="stop-row">
              <rect class="node" x="60" y="250" width="1320" height="80" rx="16" />
              <text class="diagram-code" x="250" y="302" text-anchor="middle">4</text>
              <text class="diagram-code" x="660" y="302" text-anchor="middle">false</text>
              <text class="diagram-text" x="1120" y="302" text-anchor="middle">繰り返し終了</text>
            </g>
          </svg>
        </figure>
        <p class="summary">条件がfalseの回は本体へ入らない。4は表示されない。</p>
      </main>
      <footer class="slide-footer">
        <div class="source">Go言語仕様：For statements</div>
        <div>Go 1.27 / 2026-10-24</div>
      </footer>
    </article>
  </body>
</html>
