# 毎週月曜と手動の実行で、全ワークフローのオンラインの監査と、固定した SHA の検証の結果を出す
name: security-audit
on:
  schedule:
    - cron: 17 9 * * 1
      timezone: Asia/Tokyo
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Run online audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked --script .gha/gha.py check --online
      - name: Verify pinned actions
        run: uv run --locked --script .gha/gha.py pin --verify
