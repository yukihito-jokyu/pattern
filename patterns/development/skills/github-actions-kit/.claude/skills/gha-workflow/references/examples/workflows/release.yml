# v から始まるタグの push で、キットのアーカイブを来歴の証明付きで GitHub Release に公開する
name: release
on:
  push:
    tags:
      - v*
permissions: {}
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  check:
    uses: ./.github/workflows/reusable-check.yml
    permissions:
      contents: read
    with:
      enable-cache: false
  build:
    needs:
      - check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build kit archive
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          archive="github-actions-kit-$REF_NAME"
          git archive --format=tar.gz --prefix="$archive/" --output="$archive.tar.gz" HEAD
      - name: Upload kit archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          name: kit-archive
          path: github-actions-kit-*.tar.gz
          retention-days: 1
  publish:
    needs:
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download kit archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kit-archive
      - name: Attest kit archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: github-actions-kit-*.tar.gz
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release create "$REF_NAME" github-actions-kit-*.tar.gz \
            --repo "$REPOSITORY" --verify-tag --generate-notes
