name: Verify and publish pattern repository

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.13.4
      - name: Check workflows
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          validation_root=$(mktemp -d "$RUNNER_TEMP/workflow-check.XXXXXX")
          trap 'rm -rf "$validation_root"' EXIT
          git clone --shared --no-checkout . "$validation_root"
          cp -R .github "$validation_root/.github"
          cp -R patterns/development/skills/github-actions-kit/.gha "$validation_root/.gha"
          cd "$validation_root"
          uv run --locked --script .gha/gha.py check --ratchet "$BASE_SHA"
      - name: Run unit tests
        run: npm test
      - name: Check types
        run: npm run typecheck
      - name: Build site and ZIPs
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:e2e
      - name: Upload verified site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: build
      - name: Upload failure logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    if: >-
      always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.verify.result == 'success' && needs.discover-patterns.result == 'success' &&
      ((needs.patterns.result == 'success' && needs.discover-patterns.outputs.has-patterns == 'true') ||
       (needs.patterns.result == 'skipped' && needs.discover-patterns.outputs.has-patterns == 'false'))
    needs: [verify, discover-patterns, patterns]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check current main commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "古いコミットのためPages公開を省略しました。" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Configure GitHub Pages
        if: ${{ steps.current.outputs.current == 'true' }}
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Deploy verified site
        id: deployment
        if: ${{ steps.current.outputs.current == 'true' }}
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  discover-patterns:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has-patterns: ${{ steps.matrix.outputs.has-patterns }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - id: matrix
        name: Select changed patterns
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            matrix=$(node scripts/pattern-ci.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --merge-base)
          elif [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            matrix=$(node scripts/pattern-ci.mjs)
          else
            matrix=$(node scripts/pattern-ci.mjs --base "$BASE_SHA" --head "$HEAD_SHA")
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "has-patterns=$(node -e 'console.log(JSON.parse(process.argv[1]).include.length > 0)' "$matrix")" >> "$GITHUB_OUTPUT"

  patterns:
    needs: discover-patterns
    if: needs.discover-patterns.outputs.has-patterns == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-patterns.outputs.matrix) }}
    name: Verify ZIP (${{ matrix.id }})
    env:
      PATTERN_ID: ${{ matrix.id }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: matrix.goVersionFile != ''
        with:
          go-version-file: ${{ matrix.goVersionFile }}
          cache: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: matrix.pythonVersion != ''
        with:
          python-version: ${{ matrix.pythonVersion }}
      - name: Install dependencies
        run: npm ci
      - name: Verify standalone ZIP
        shell: bash
        run: |
          set -o pipefail
          export CI_ARTIFACTS_DIR="$RUNNER_TEMP/pattern-ci-artifacts"
          mkdir -p "$CI_ARTIFACTS_DIR"
          npm run verify:patterns -- --id "$PATTERN_ID" --ci --timeout-ms 1200000 2>&1 | tee "$CI_ARTIFACTS_DIR/verification.log"
      - name: Upload failure logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: pattern-results-${{ strategy.job-index }}
          path: ${{ runner.temp }}/pattern-ci-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  report:
    needs:
      - deploy
      - discover-patterns
      - patterns
      - verify
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write
    concurrency:
      group: ci-timing-report-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Report verification results and timings
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-result.mjs
