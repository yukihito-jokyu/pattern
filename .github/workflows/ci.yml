name: Verify and publish pattern repository

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload verified site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  timing-report:
    name: CI Timing Report
    needs: [verify, discover-patterns, patterns]
    if: >-
      !cancelled() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write
    concurrency:
      group: ci-timing-report-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect durations and update PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-timing-report.mjs

  deploy:
    if: >-
      always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.verify.result == 'success' && needs.discover-patterns.result == 'success' &&
      (needs.patterns.result == 'success' ||
       (needs.patterns.result == 'skipped' && needs.discover-patterns.outputs.has-patterns == 'false'))
    needs: [verify, discover-patterns, patterns]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@v4

  discover-patterns:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has-patterns: ${{ steps.matrix.outputs.has-patterns }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: matrix
        name: Select changed patterns
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            matrix=$(node scripts/pattern-ci.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --merge-base)
          elif [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            matrix=$(node scripts/pattern-ci.mjs)
          else
            matrix=$(node scripts/pattern-ci.mjs --base "$BASE_SHA" --head "$HEAD_SHA")
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "has-patterns=$(node -e 'console.log(JSON.parse(process.argv[1]).include.length > 0)' "$matrix")" >> "$GITHUB_OUTPUT"

  patterns:
    needs: discover-patterns
    if: needs.discover-patterns.outputs.has-patterns == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-patterns.outputs.matrix) }}
    name: Verify ZIP (${{ matrix.id }})
    env:
      PATTERN_ID: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        if: matrix.goVersionFile != ''
        with:
          go-version-file: ${{ matrix.goVersionFile }}
          cache: false
      - uses: actions/setup-python@v5
        if: matrix.pythonVersion != ''
        with:
          python-version: ${{ matrix.pythonVersion }}
      - run: npm ci
      - name: Verify standalone ZIP
        shell: bash
        run: |
          set -o pipefail
          export CI_ARTIFACTS_DIR="$RUNNER_TEMP/pattern-ci-artifacts"
          mkdir -p "$CI_ARTIFACTS_DIR"
          npm run verify:patterns -- --id "$PATTERN_ID" --ci --timeout-ms 1200000 2>&1 | tee "$CI_ARTIFACTS_DIR/verification.log"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pattern-results-${{ strategy.job-index }}
          path: ${{ runner.temp }}/pattern-ci-artifacts/
          if-no-files-found: ignore
          retention-days: 7
