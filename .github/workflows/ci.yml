name: Verify and publish pattern repository

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.13.4
      - name: Check workflows
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          validation_root=$(mktemp -d "$RUNNER_TEMP/workflow-check.XXXXXX")
          trap 'rm -rf "$validation_root"' EXIT
          git clone --shared --no-checkout . "$validation_root"
          cp -R .github "$validation_root/.github"
          cp -R patterns/development/skills/github-actions-kit/.gha "$validation_root/.gha"
          cd "$validation_root"
          uv run --locked --script .gha/gha.py check --ratchet "$BASE_SHA"
      - name: Run unit tests
        run: npm test
      - name: Check types
        run: npm run typecheck
      - name: Build site and ZIPs
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:e2e
      - name: Upload verified site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build
      - name: Upload failure logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    if: >-
      always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.verify.result == 'success' && needs.discover-patterns.result == 'success' &&
      ((needs.patterns.result == 'success' && needs.discover-patterns.outputs.has-patterns == 'true') ||
       (needs.patterns.result == 'skipped' && needs.discover-patterns.outputs.has-patterns == 'false'))
    needs: [verify, discover-patterns, patterns]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check current main commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "古いコミットのためPages公開を省略しました。" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Configure GitHub Pages
        if: ${{ steps.current.outputs.current == 'true' }}
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy verified site
        id: deployment
        if: ${{ steps.current.outputs.current == 'true' }}
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  discover-patterns:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has-patterns: ${{ steps.matrix.outputs.has-patterns }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: matrix
        name: Select changed patterns
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            matrix=$(node scripts/pattern-ci.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --merge-base)
          elif [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            matrix=$(node scripts/pattern-ci.mjs)
          else
            matrix=$(node scripts/pattern-ci.mjs --base "$BASE_SHA" --head "$HEAD_SHA")
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "has-patterns=$(node -e 'console.log(JSON.parse(process.argv[1]).include.length > 0)' "$matrix")" >> "$GITHUB_OUTPUT"

  patterns:
    needs: discover-patterns
    if: needs.discover-patterns.outputs.has-patterns == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-patterns.outputs.matrix) }}
    name: Verify ZIP (${{ matrix.id }})
    env:
      PATTERN_ID: ${{ matrix.id }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.goVersionFile != ''
        with:
          go-version-file: ${{ matrix.goVersionFile }}
          cache: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.pythonVersion != ''
        with:
          python-version: ${{ matrix.pythonVersion }}
      - name: Install dependencies
        run: npm ci
      - name: Verify standalone ZIP
        shell: bash
        run: |
          set -o pipefail
          export CI_ARTIFACTS_DIR="$RUNNER_TEMP/pattern-ci-artifacts"
          mkdir -p "$CI_ARTIFACTS_DIR"
          npm run verify:patterns -- --id "$PATTERN_ID" --ci --timeout-ms 1200000 2>&1 | tee "$CI_ARTIFACTS_DIR/verification.log"
      - name: Upload failure logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: pattern-results-${{ strategy.job-index }}
          path: ${{ runner.temp }}/pattern-ci-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  report:
    needs:
      - deploy
      - discover-patterns
      - patterns
      - verify
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write
    concurrency:
      group: ci-timing-report-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Report verification results and timings
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-result.mjs
