name: Verify and publish pattern repository

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload verified site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, docusaurus-basic]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@v4

  docusaurus-basic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run downloads:build
      - name: Extract standalone pattern
        run: unzip static/downloads/patterns/web/documentation/docusaurus-basic.zip -d "$RUNNER_TEMP/pattern-verification"
      - run: npm ci
        working-directory: ${{ runner.temp }}/pattern-verification/docusaurus-basic
      - run: npm run setup -- check
        working-directory: ${{ runner.temp }}/pattern-verification/docusaurus-basic
      - run: npm run typecheck
        working-directory: ${{ runner.temp }}/pattern-verification/docusaurus-basic
      - run: npm run build
        working-directory: ${{ runner.temp }}/pattern-verification/docusaurus-basic
      - run: npx playwright install --with-deps chromium
        working-directory: ${{ runner.temp }}/pattern-verification/docusaurus-basic
      - run: npm test
        working-directory: ${{ runner.temp }}/pattern-verification/docusaurus-basic
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: docusaurus-basic-browser-results
          path: ${{ runner.temp }}/pattern-verification/docusaurus-basic/test-results/
          if-no-files-found: ignore
          retention-days: 7
